<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaboom - Social App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="app-header">
            <h1>KABOOM 💥</h1>
            <div class="nav-buttons">
                <button onclick="switchTab('feed')">Feed</button>
                <button onclick="switchTab('upload')">Nahrát</button>
                <button onclick="switchTab('live')">Live</button>
                <button onclick="switchTab('profile')">Můj profil</button>
            </div>
        </header>

        <main>
            <section id="tab-feed" class="tab-content active">
                <div class="feed-filter">
                    <button class="filter-btn active" onclick="filterFeed('all')">Vše</button>
                    <button class="filter-btn" onclick="filterFeed('short')">Shorts ⚡</button>
                    <button class="filter-btn" onclick="filterFeed('long')">Long-form 🎬</button>
                </div>
                <div id="posts-container"></div>
            </section>

            <section id="tab-upload" class="tab-content">
                <h2>Nový příspěvek</h2>
                <form id="upload-form" onsubmit="handleUpload(event)">
                    <input type="text" id="post-title" placeholder="Název videa..." required>
                    <select id="post-type" required>
                        <option value="short">Short (krátké video)</option>
                        <option value="long">Long-form (dlouhé video)</option>
                    </select>
                    <input type="file" id="post-file" accept="video/*" required>
                    <button type="submit" class="btn-primary">Publikovat</button>
                </form>
            </section>

            <section id="tab-live" class="tab-content">
                <h2>Kaboom Live Stream</h2>
                <div class="live-container">
                    <div class="video-grid">
                        <video id="local-video" autoplay muted playsinline></video>
                        <video id="remote-video" autoplay playsinline></video>
                    </div>
                    <div class="live-controls">
                        <button id="btn-toggle-cam" onclick="toggleCamera()">Vypnout kameru</button>
                        <button id="btn-toggle-mic" onclick="toggleMic()">Vypnout zvuk</button>
                        <button onclick="startLivestream()" class="btn-primary">Spustit Stream</button>
                    </div>
                </div>
            </section>

            <section id="tab-profile" class="tab-content">
                <div class="profile-card">
                    <img id="profile-avatar" src="https://via.placeholder.com/100" alt="Avatar">
                    <h2 id="profile-name">Uživatel</h2>
                    <p id="profile-bio">Tady bude bio uživatele...</p>
                    <div id="profile-posts"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
